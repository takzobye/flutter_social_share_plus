name: flutter_social_share_plus_example
description: Demonstrates how to use the flutter_social_share_plus plugin.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_social_share_plus:
    path: ../
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
