name: flutter_social_share_plus
description: Share content to Instagram and Facebook from your Flutter app. Supports feed posts, stories, reels, and direct messages.
version: 1.0.0
homepage: https://github.com/takzobye/flutter_social_share_plus
repository: https://github.com/takzobye/flutter_social_share_plus

environment:
  sdk: ^3.11.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.takzobye.flutter_social_share_plus
        pluginClass: FlutterSocialSharePlusPlugin
      ios:
        pluginClass: FlutterSocialSharePlusPlugin
