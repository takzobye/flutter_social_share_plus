name: flutter_social_share_plus
description: Share local media to Instagram and Facebook feeds and stories from Flutter.
version: 1.0.0
homepage: https://github.com/takzobye/flutter_social_share_plus
repository: https://github.com/takzobye/flutter_social_share_plus

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.takzobye.flutter_social_share_plus
        pluginClass: FlutterSocialSharePlusPlugin
      ios:
        pluginClass: FlutterSocialSharePlusPlugin
